<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('cloudcore-theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCore - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="login-container">
        <div class="theme-switcher">
            <button class="theme-btn" id="themeBtn" title="Toggle theme">
                <span class="material-symbols-outlined theme-icon">dark_mode</span>
            </button>
        </div>

        <div class="language-switcher">
            <button class="language-btn" id="languageBtn" title="Switch language">
                <span class="material-symbols-outlined">language</span>
                <span class="language-code">EN</span>
            </button>
        </div>

        <h1>
            <div class="logo">
                <span class="material-symbols-outlined">cloud</span>
            </div>
            CloudCore
        </h1>

        <h2 style="text-align: center; color: var(--text-primary); font-size: 20px; margin-bottom: 24px; font-weight: 500;">
            <span data-i18n="resetPasswordTitle">Reset Your Password</span>
        </h2>

        <div id="error-message" class="error" style="display: none;"></div>
        <div id="success-message" class="success" style="display: none;"></div>

        <form class="login-form" id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword" data-i18n="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" name="newPassword" required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
                <div class="password-requirements">
                    <div class="requirement" id="req-length">
                        <span class="req-dot"></span>
                        <span data-i18n="passwordReqLength">At least 8 characters</span>
                    </div>
                    <div class="requirement" id="req-lowercase">
                        <span class="req-dot"></span>
                        <span data-i18n="passwordReqLowercase">One lowercase letter</span>
                    </div>
                    <div class="requirement" id="req-number">
                        <span class="req-dot"></span>
                        <span data-i18n="passwordReqNumber">One number</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
                <div class="password-match-hint" id="password-match-hint" style="display: none;">
                    <span class="material-symbols-outlined">error</span>
                    <span data-i18n="passwordsNoMatch">Passwords do not match</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="resetBtn" data-i18n="resetPassword">
                Reset Password
            </button>
        </form>

        <div class="login-link">
            <a href="login.html" data-i18n="backToSignIn">Back to Sign In</a>
        </div>
    </div>

    <script type="module" src="js/reset-password.js"></script>
</body>

</html>
